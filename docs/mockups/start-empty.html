<!DOCTYPE html>
<html lang="en" class="dark" data-theme="amber">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatur</title>
<link rel="stylesheet" href="chatur.css">
<script>(function(){var t=localStorage.getItem('chatur-theme')||'dark';document.documentElement.classList.toggle('dark',t==='dark');})();</script>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
<symbol id="i-sln" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M3 9h6"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></symbol>
<symbol id="i-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="i-blank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 11v6M9 14h6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</defs></svg>
<script>
function say(m){alert(m);}
function closeAll(keep){document.querySelectorAll('.menu.open,.popwrap.open').forEach(function(e){if(e!==keep)e.classList.remove('open');});}
function pop(btn,ev){ev.stopPropagation();var w=btn.parentNode;var was=w.classList.contains('open');closeAll();if(!was)w.classList.add('open');}
document.addEventListener('click',function(){closeAll();});
function toggleTheme(){var d=document.documentElement.classList.toggle('dark');localStorage.setItem('chatur-theme',d?'dark':'light');}
function setPalette(p,ev){if(ev)ev.stopPropagation();document.documentElement.setAttribute('data-theme',p);localStorage.setItem('chatur-palette',p);
 var n=document.getElementById('palette-name');if(n)n.textContent=p.charAt(0).toUpperCase()+p.slice(1);
 document.querySelectorAll('#palette-pop .tick').forEach(function(s){s.innerHTML='';});
 var t=document.querySelector('#palette-tick-'+p);if(t)t.innerHTML='✓';closeAll();}
document.addEventListener('DOMContentLoaded',function(){setPalette(localStorage.getItem('chatur-palette')||'amber');});
</script>

<div class="startwin" data-testid="start-window">

 <div class="startbar" data-testid="startbar">
  <a class="logo" href="index.html" data-testid="logo" title="Chatur — click for the list of screens" aria-label="Chatur"></a>
  <span class="wordmark" data-testid="wordmark">Chatur</span>
  <span class="grow"></span>
  <div class="popwrap" data-testid="account">
   <button class="pick" style="height:26px;border:0" onclick="pop(this,event)"><span class="av">TR</span><span class="nm">Techie Rathore</span><svg><use href="#i-chevron"/></svg></button>
   <div class="pop right" data-testid="account-pop" data-tf-state="popup-open">
    <div class="note">techierathore@gmail.com</div>
    <a href="settings-account.html">Account</a>
    <a href="licence.html">Licence</a>
    <a href="settings-providers.html">Settings…</a>
    <hr>
    <a href="sign-in.html">Sign out</a>
   </div>
  </div>
  <button class="iconbtn" onclick="toggleTheme()" title="Light or dark" data-testid="theme-toggle"><svg><use href="#i-theme"/></svg></button>
  <div class="popwrap" data-testid="palette" data-tf-state="mockup-only">
   <button class="pick" style="height:24px" onclick="pop(this,event)" title="Only in this mockup — the real one lives in Settings ▸ Appearance"><span class="lbl">Palette</span><span id="palette-name">Amber</span><svg><use href="#i-chevron"/></svg></button>
   <div class="pop right" id="palette-pop" data-testid="palette-pop" data-tf-state="popup-open">
    <button onclick="setPalette('amber',event)"><span class="tick" id="palette-tick-amber">✓</span>Amber</button>
    <button onclick="setPalette('indigo',event)"><span class="tick" id="palette-tick-indigo"></span>Indigo</button>
    <button onclick="setPalette('teal',event)"><span class="tick" id="palette-tick-teal"></span>Teal</button>
    <button onclick="setPalette('slate',event)"><span class="tick" id="palette-tick-slate"></span>Slate</button>
   </div>
  </div>
 </div>

 <div class="startbody" style="justify-content:center;align-items:flex-start">

  <div class="startright" data-testid="empty-start" style="border:0;background:transparent;max-width:440px;width:100%;margin:48px auto 0">
   <div><div class="h1" style="font-size:18px;font-weight:600">Nothing is open yet</div>
    <div class="lead" style="color:var(--dim);font-size:13px">Choose what to work on. Chatur opens it and you are straight into the work.</div></div>

   <!-- BRD-219: each icon says what its way in does and sits centred in its tile; data-icon names the Lucide icon the build uses.
        BRD-14, BRD-247 (22 Nov 2026): New project comes first, so a person starting from nothing can make one. -->
   <button class="bigaction" onclick="say('Opens New project: this machine\'s templates, the solution\'s name, the framework and one Location field. Under it the two full paths that will exist: the solution file in that folder itself, and the project in one folder under it. Create makes them and opens the solution.')" data-testid="way-new-project">
    <span class="ic" data-icon="plus"><svg><use href="#i-plus"/></svg></span>
    <span><b>New project</b><span>A solution and its first project, from a template</span></span>
   </button>

   <button class="bigaction" onclick="say('Opens any folder on disk as it is.')" data-testid="way-open-folder">
    <span class="ic" data-icon="folder"><svg><use href="#i-folder"/></svg></span>
    <span><b>Open a folder</b><span>Anything on disk, project or not</span></span>
   </button>

   <button class="bigaction" onclick="say('Opens the Open a solution dialog: Browse picks a .sln or .slnx file, and Chatur reads every project in it.')" data-testid="way-open-solution">
    <span class="ic" data-icon="layers"><svg><use href="#i-layers"/></svg></span>
    <span><b>Open a solution</b><span>A .sln or .slnx, with its projects read</span></span>
   </button>

   <button class="bigaction" onclick="say('Opens the folder that holds the file, with the file open.')" data-testid="way-open-file">
    <span class="ic" data-icon="file"><svg><use href="#i-file"/></svg></span>
    <span><b>Open a file</b><span>With the folder that holds it</span></span>
   </button>

   <div class="row" style="margin-top:6px"><span class="xs faint">Chatur can also search folders you name.</span><span class="grow"></span>
    <button class="pick" onclick="say('Names the folders Chatur searches for projects.')" data-testid="manage-folders">Project folders</button></div>
  </div>

 </div>
</div>
</body>
</html>
