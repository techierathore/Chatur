# Release pipeline (REQ-NFR-006, BRD-158; Architecture §6 decision rows 2026-09-21 / 2026-09-30).
#
#   push to main  -> a `macos` and a `windows` job build + zip the app, then `release` replaces the
#                    rolling nightly pre-release with both zips.
#   push of v*    -> the same two builds, then `release` publishes a named release with both zips.
#
# Version and commit stamping: Directory.Build.props (target ChaturStampBuildInfo) turns
# -p:VersionPrefix / -p:ChaturReleaseBuild / -p:ChaturCommitSha into the assembly's
# InformationalVersion and Chatur.CommitSha metadata. A -p: value is an MSBuild *global* property, so
# the stamping target's own read of .git (which on a tag build is a detached HEAD) can never override
# the ChaturCommitSha passed here; github.sha always wins.
#
# Asset names are chosen for Chatur.Core.Prerequisites.NightlyRelease.DownloadUrlForThisMachine,
# which picks the first asset whose name contains "mac" (Mac) or "win" (anything else),
# case-insensitively: Chatur-<version>-maccatalyst.zip and Chatur-<version>-win-x64.zip.
#
# The nightly tag is v<VersionPrefix>-nightly (not a bare "nightly"): GitHubReleaseClient reads the
# version out of the release TAG (NightlyRelease.ParseVersion), and the bare tag "nightly" carries no
# digits, so the app would never offer it. GitHubReleaseClient also needs target_commitish to be a
# commit SHA, so the nightly release is created with --target <sha>.
#
# No code signing (Architecture §6: none before phase 4).
name: release

on:
  push:
    branches: [main]
    tags: ['v*', '!v*-nightly']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# Never cancel a run mid-publish: a cancelled `release` job could leave the nightly deleted.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Feed source key in nuget.config. Auth: a PAT secret NUGET_GITHUB_TOKEN (read:packages) if set,
  # else the built-in GITHUB_TOKEN. GITHUB_TOKEN can only read a package that grants this repository
  # access, so if restore answers 401/403 for TrBlazeUI, add the secret (see the restore step).
  NUGET_SOURCE_NAME: TrBlazeUI
  NUGET_FEED_USER: techierathore

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      nightly_tag: ${{ steps.v.outputs.nightly_tag }}
      msbuild_props: ${{ steps.v.outputs.msbuild_props }}
      is_tag: ${{ steps.v.outputs.is_tag }}
      is_main: ${{ steps.v.outputs.is_main }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          # Default VersionPrefix as Directory.Build.props declares it (used for nightly names).
          default_prefix="$(grep -oP '<VersionPrefix[^>]*>\K[0-9]+(\.[0-9]+){1,3}(?=</VersionPrefix>)' Directory.Build.props | head -n1)"
          [ -n "$default_prefix" ] || { echo "Could not read VersionPrefix from Directory.Build.props" >&2; exit 1; }

          is_tag=false; is_main=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            is_tag=true
            tag="${GITHUB_REF#refs/tags/}"
            ver="${tag#v}"                 # 0.2.0 or 0.2.0-beta.1
            prefix="${ver%%-*}"
            props="-p:ChaturReleaseBuild=true -p:VersionPrefix=${prefix}"
            if [[ "$ver" == *-* ]]; then
              props="$props -p:VersionSuffix=${ver#*-}"
            fi
            asset_version="$ver"
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]] && is_main=true
            # Nightly: VersionSuffix defaults to "nightly" in Directory.Build.props.
            props=""
            asset_version="${default_prefix}-nightly"
          fi

          {
            echo "version=${asset_version}"
            echo "nightly_tag=v${default_prefix}-nightly"
            echo "msbuild_props=${props} -p:ChaturCommitSha=${GITHUB_SHA} -p:SourceRevisionId=${GITHUB_SHA}"
            echo "is_tag=${is_tag}"
            echo "is_main=${is_main}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${asset_version} props=${props}"

  macos:
    name: macOS (Mac Catalyst)
    needs: meta
    runs-on: macos-latest
    env:
      MACCATALYST_WORKLOAD_SET: 10.0.303.1
    steps:
      - uses: actions/checkout@v4

      # The Mac Catalyst workload must match the runner's Xcode. The newest .NET SDK band brings
      # Mac Catalyst 27, which needs Xcode 27, and the runner's newest Xcode is 26.x. So this job stays
      # on the 10.0.3xx SDK band and its workload set 10.0.303.1 (Mac Catalyst 26.5, built for Xcode 26).
      # Move both together when the runner image ships Xcode 27.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.3xx

      # The runner image may already carry a newer SDK, and dotnet picks the highest installed one.
      # This global.json exists only on the runner, for this job; it is never committed.
      - name: Hold the SDK to the 10.0.3xx band
        shell: bash
        run: |
          echo '{ "sdk": { "version": "10.0.300", "rollForward": "latestPatch" } }' > global.json
          dotnet --version

      - name: Install MAUI workload
        run: dotnet workload install maui-maccatalyst --version "$MACCATALYST_WORKLOAD_SET"

      # The Mac Catalyst SDK refuses any Xcode whose major.minor differs from the one it was built for
      # (target _ValidateXcodeVersion, error E0191). That Xcode is the pack's own _RecommendedXcodeVersion
      # (targets/Microsoft.MacCatalyst.Sdk.Versions.props) — NOT the "26.5" in the pack's name, which is the
      # platform version (pack 26.5.10315 wants Xcode 26.6). It is read from the exact pack version the
      # PINNED workload set installed, never from the newest pack on the runner. The exact
      # Xcode is selected when the runner has it; otherwise the newest Xcode of the same major version is
      # selected and the strict check is turned off (ValidateXcodeVersion=false, the SDK's own switch),
      # with a warning. Every fact is written as an annotation, so a failure can be read without the log.
      - name: Select the Xcode the Mac Catalyst SDK was built for
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(dotnet --version)"
          case "$sdk" in 10.0.3*) ;; *) echo "::error::The SDK in use is $sdk, not 10.0.3xx; the global.json hold did not take."; exit 1 ;; esac
          manifest="$(dotnet workload search version "$MACCATALYST_WORKLOAD_SET" --format json \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["manifestVersions"]["microsoft.net.sdk.maccatalyst"].split("/")[0])')"
          root="${DOTNET_ROOT:-$(dirname "$(command -v dotnet)")}"
          props="$(ls "$root"/packs/Microsoft.MacCatalyst.Sdk.*/"$manifest"/targets/Microsoft.MacCatalyst.Sdk.Versions.props 2>/dev/null | head -n1 || true)"
          [ -n "$props" ] || { echo "::error::Mac Catalyst pack $manifest is not installed under $root/packs."; exit 1; }
          want="$(sed -n 's:.*<_RecommendedXcodeVersion>\([0-9.]*\)</_RecommendedXcodeVersion>.*:\1:p' "$props" | head -n1 | cut -d. -f1-2)"
          [ -n "$want" ] || { echo "::error::No _RecommendedXcodeVersion in $props."; exit 1; }
          installed="$(ls -d /Applications/Xcode_*.app 2>/dev/null | xargs -n1 basename | sort -V | tr '\n' ' ')"
          echo "::notice::SDK $sdk, workload set $MACCATALYST_WORKLOAD_SET, Mac Catalyst $manifest wants Xcode $want. Installed: $installed"
          # Candidates of the wanted version, real folders first: on the runner image some Xcode_X.Y.Z.app
          # entries are aliases of Xcode_X.Y.app, and actool cannot find the macOS SDK through an alias
          # (run 37209733217: 'SDK .../Xcode_26.6.0.app/.../MacOSX.sdk cannot be located').
          list() { for a in $(ls -d "$@" 2>/dev/null | sort -V -r); do [ -L "$a" ] || echo "$a"; done; for a in $(ls -d "$@" 2>/dev/null | sort -V -r); do [ -L "$a" ] && echo "$a"; done; true; }
          candidates="$(list /Applications/Xcode_"$want".app /Applications/Xcode_"$want".*.app)"
          if [ -z "$candidates" ]; then
            candidates="$(list /Applications/Xcode_"${want%%.*}".*.app)"
            [ -n "$candidates" ] || { echo "::error::No Xcode ${want%%.*}.x on this runner. Installed: $installed"; exit 1; }
            echo "XCODE_CHECK=-p:ValidateXcodeVersion=false" >> "$GITHUB_ENV"
            echo "::warning::No Xcode $want on this runner; using the newest ${want%%.*}.x with the strict Xcode check off."
          fi
          # Keep the first candidate whose macOS SDK and actool (the asset catalog compiler) can be found.
          chosen=""
          for c in $candidates; do
            real="$(cd "$c" && pwd -P)"
            sudo xcode-select -s "$real/Contents/Developer"
            sudo xcodebuild -runFirstLaunch >/dev/null 2>&1 || true
            if sdkpath="$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)" && [ -d "$sdkpath" ] && xcrun --sdk macosx --find actool >/dev/null 2>&1; then
              chosen="$real"; break
            fi
            echo "::warning::$(basename "$c") ($real) has no usable macOS SDK or actool; trying the next one."
          done
          [ -n "$chosen" ] || { echo "::error::No candidate Xcode has a usable macOS SDK and actool: $(echo $candidates)"; exit 1; }
          echo "::notice::Selected $chosen: $(xcodebuild -version | tr '\n' ' ') macOS SDK $(xcrun --sdk macosx --show-sdk-path), actool $(xcrun --sdk macosx --find actool)"

      - name: Authenticate to the GitHub Packages feed
        env:
          FEED_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget update source "$NUGET_SOURCE_NAME" --configfile nuget.config
          --username "$NUGET_FEED_USER" --password "$FEED_TOKEN" --store-password-in-clear-text

      # A downloaded Chatur signs in to the owner's App Manager (decision 2026-10-06, option A). A
      # downloadable app uses an installed-app key (pk_live_…, no secret; AppManager API usage guide
      # §2.1.1): the app sends X-Api-Key plus its own X-Device-Id, never a secret. The address and the key
      # come from repository secrets and are written into the settings file the build embeds, on the
      # runner only, never committed. A missing secret, or a server key (ak_live_…, which needs a secret
      # and must never ship inside a download), stops the job.
      - name: Write the App Manager address into the build's settings
        shell: pwsh
        env:
          APPMANAGER_URL: ${{ secrets.CHATUR_APPMANAGER_URL }}
          APPMANAGER_KEY: ${{ secrets.CHATUR_APPMANAGER_KEY }}
        run: |
          $missing = @('APPMANAGER_URL','APPMANAGER_KEY') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            Write-Output "::error::Set the repository secrets CHATUR_APPMANAGER_URL and CHATUR_APPMANAGER_KEY. Missing: $($missing -replace 'APPMANAGER_','CHATUR_APPMANAGER_' -join ', ')"
            exit 1
          }
          if (-not $env:APPMANAGER_KEY.StartsWith('pk_')) {
            Write-Output "::error::CHATUR_APPMANAGER_KEY must be an installed-app key (it starts pk_live_), made in App Manager with 'Generate New Key -> Installed app (no secret)'. A website key (ak_live_) needs a secret and must not ship inside a download."
            exit 1
          }
          $path = 'src/Chatur/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.AppManager | Add-Member -NotePropertyName BaseUrl -NotePropertyValue $env:APPMANAGER_URL -Force
          $settings.AppManager | Add-Member -NotePropertyName ApiKey -NotePropertyValue $env:APPMANAGER_KEY -Force
          $settings | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8
          Write-Output "::notice::App Manager address written into the build's settings: $($env:APPMANAGER_URL)"

      # Only the Mac steps (trimming, native link, app bundle) run here and nowhere else, and their
      # warnings would fail the build under TreatWarningsAsErrors; normal builds keep that rule.
      # On a failure every line that mentions an error, in any format, and the end of the output are
      # written as annotations, so the cause can be read from the run page without the log.
      - name: Publish (Mac Catalyst, unsigned)
        shell: bash
        run: |
          set -o pipefail
          dotnet publish src/Chatur/Chatur.csproj -f net10.0-maccatalyst -c Release \
            -p:CreatePackage=false -p:EnableCodeSigning=false -p:_RequireCodeSigning=false \
            -p:TreatWarningsAsErrors=false \
            ${{ needs.meta.outputs.msbuild_props }} ${{ env.XCODE_CHECK }} 2>&1 | tee publish.log || {
            grep -i -E 'error' publish.log | grep -v -i -E '0 error|error\(s\)' | sort -u | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "::notice::Last lines of the publish output: $(tail -n 25 publish.log | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          }

      - name: Zip the .app
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Chatur/bin/Release -type d -name '*.app' -not -path '*/*.app/*' | head -n1)"
          [ -n "$app" ] || { echo "No .app found under src/Chatur/bin/Release" >&2; find src/Chatur/bin/Release -maxdepth 4 >&2; exit 1; }
          echo "Zipping $app"
          mkdir -p dist
          # ditto keeps symlinks, permissions and resource forks that plain zip mangles in a .app.
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Chatur-${{ needs.meta.outputs.version }}-maccatalyst.zip"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: chatur-maccatalyst
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (win-x64)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Authenticate to the GitHub Packages feed
        shell: bash
        env:
          FEED_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget update source "$NUGET_SOURCE_NAME" --configfile nuget.config
          --username "$NUGET_FEED_USER" --password "$FEED_TOKEN" --store-password-in-clear-text

      # A downloaded Chatur signs in to the owner's App Manager (decision 2026-10-06, option A). A
      # downloadable app uses an installed-app key (pk_live_…, no secret; AppManager API usage guide
      # §2.1.1): the app sends X-Api-Key plus its own X-Device-Id, never a secret. The address and the key
      # come from repository secrets and are written into the settings file the build embeds, on the
      # runner only, never committed. A missing secret, or a server key (ak_live_…, which needs a secret
      # and must never ship inside a download), stops the job.
      - name: Write the App Manager address into the build's settings
        shell: pwsh
        env:
          APPMANAGER_URL: ${{ secrets.CHATUR_APPMANAGER_URL }}
          APPMANAGER_KEY: ${{ secrets.CHATUR_APPMANAGER_KEY }}
        run: |
          $missing = @('APPMANAGER_URL','APPMANAGER_KEY') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) {
            Write-Output "::error::Set the repository secrets CHATUR_APPMANAGER_URL and CHATUR_APPMANAGER_KEY. Missing: $($missing -replace 'APPMANAGER_','CHATUR_APPMANAGER_' -join ', ')"
            exit 1
          }
          if (-not $env:APPMANAGER_KEY.StartsWith('pk_')) {
            Write-Output "::error::CHATUR_APPMANAGER_KEY must be an installed-app key (it starts pk_live_), made in App Manager with 'Generate New Key -> Installed app (no secret)'. A website key (ak_live_) needs a secret and must not ship inside a download."
            exit 1
          }
          $path = 'src/Chatur/appsettings.json'
          $settings = Get-Content $path -Raw | ConvertFrom-Json
          $settings.AppManager | Add-Member -NotePropertyName BaseUrl -NotePropertyValue $env:APPMANAGER_URL -Force
          $settings.AppManager | Add-Member -NotePropertyName ApiKey -NotePropertyValue $env:APPMANAGER_KEY -Force
          $settings | ConvertTo-Json -Depth 10 | Set-Content $path -Encoding utf8
          Write-Output "::notice::App Manager address written into the build's settings: $($env:APPMANAGER_URL)"

      - name: Publish (unpackaged, self-contained)
        run: >
          dotnet publish src/Chatur/Chatur.csproj -f net10.0-windows10.0.19041.0 -c Release
          -r win-x64 --self-contained -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -o publish-win ${{ needs.meta.outputs.msbuild_props }}

      - name: Zip the publish folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish-win/* -DestinationPath "dist/Chatur-${{ needs.meta.outputs.version }}-win-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: chatur-win-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, macos, windows]
    # main pushes -> nightly; v* tag pushes -> named release. workflow_dispatch on any other ref only builds.
    if: needs.meta.outputs.is_tag == 'true' || needs.meta.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Named release (v* tag)
        if: needs.meta.outputs.is_tag == 'true'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          [[ "$tag" == *-* ]] && prerelease="--prerelease"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "Chatur ${tag#v}" --generate-notes --verify-tag $prerelease
          fi

      - name: Replace the nightly pre-release (main)
        if: needs.meta.outputs.is_main == 'true'
        run: |
          set -euo pipefail
          # Drop every previous nightly (the tag name tracks VersionPrefix, so an older one may linger),
          # and its tag, then recreate at this commit: target_commitish becomes the full SHA.
          for old in $(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | endswith("-nightly")) | .tagName'); do
            gh release delete "$old" --cleanup-tag --yes
          done
          gh release create "${{ needs.meta.outputs.nightly_tag }}" dist/*.zip \
            --target "${GITHUB_SHA}" --prerelease \
            --title "Chatur nightly (${GITHUB_SHA::7})" \
            --notes "Rolling build of main at ${GITHUB_SHA}. Replaced on every push to main."
